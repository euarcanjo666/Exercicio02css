
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Posicionamento</title>

    <style>
        /* Reset CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ecf0f1;
        }

        /* Cabeçalho sticky */
        header {
            position: sticky;
            top: 0;
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 15px;
            z-index: 1000;
        }

        /* Menu lateral fixo */
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            padding-top: 80px;
        }

        .menu ul {
            list-style: none;
        }

        .menu li {
            margin-bottom: 20px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        /* Conteúdo principal */
        main {
            margin-left: 220px;
            padding: 20px;
        }

        section {
            min-height: 500px;
            padding: 30px;
            margin-bottom: 20px;
            background-color: white;
            border-radius: 10px;
        }

        section h2 {
            color: #34495e;
            margin-bottom: 20px;
        }

        /* Botão flutuante */
        .botao-flutuante {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background-color: #e74c3c;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Página</h1>
    </header>

    <nav class="menu">
        <h2>Menu</h2>
        <br>
        <ul>
            <li><a href="#secao1">Seção 1</a></li>
            <li><a href="#secao2">Seção 2</a></li>
            <li><a href="#secao3">Seção 3</a></li>
        </ul>
    </nav>

    <main>
        <section id="secao1">
            <h2>Seção 1</h2>
        </section>

        <section id="secao2">
            <h2>Seção 2</h2>
        </section>

        <section id="secao3">
            <h2>Seção 3</h2>
        </section>
    </main>

    <button
        class="botao-flutuante"
        aria-label="Voltar ao topo"
        onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        ↑
    </button>

</body>
</html>
